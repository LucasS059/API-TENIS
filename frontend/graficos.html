<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análise de Partida de Tênis</title>
    <link rel="stylesheet" href="/graficos.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>

<body>
    <div class="header">
        <h1>API de Tênis - Análise de Partida</h1>
    <div class="main-container">
        <h1>Análise de Partida de Tênis</h1>
        <div class="controls-container">
            <select id="partida-dropdown">
                <option value="">-- Selecione uma partida --</option>
            </select>
            <button id="load-button" class="btn-primary">Carregar Gráficos</button>
        </div>

        <div id="points-chart" class="chart-container">
            <h2>Desempenho dos Jogadores por Ponto</h2>
        </div>

        <div id="radar-chart" class="chart-container">
            <h2>Resumo de Categorias da Partida</h2>
        </div>

        <div id="stats-chart" class="stats-container">
            <h2>Estatísticas da Partida</h2>
        </div>
    </div>

    <div>
        <a href="/" class="btn-secondary">Voltar à Página Inicial</a>
    </div>

    <script src="/graficos.js"></script>
</body>

</html>
